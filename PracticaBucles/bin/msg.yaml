tags: ["linux", "android", "sandboxing", "security"]
assistant_tone: formal
assistant_force_use_plain_text: yes
assistant_lang: Russian

user_lang: Russian
user_prompt_type: reasoning
user_prompt: |
    В Android каждое установленное приложение — это отдельный пользователь. При этом ОС является графической. Это значит, что для взамодействия с «приложениями» нужно, чтобы они взаимодействовали с одним «дисплеем». Хочу сделать подобное в обычном Unix/Linux.
	
	Для начала поясню, что мы будем использовать.
		
	* `doas` в качестве замены `sudo`, потому что он легче и делает ровно то, что мне нужно;
	* `firejail` для дополнительной изоляции клиентов X Window System (nested X server);
	* `newgrp` и группы `video`, `audio`. Не факт, что сработает, но нужно для доступа к GPU и устройством аудиовывода.
	* Примечание. В форке XLibre имеется расширение Xnamespaces, которое не даёт клиентам вмешиваться в работу друг друга; это не полная изоляция, но всё же изоляция.
	
	Итак, приступаем к изоляции.
	
	xauth extract - "$DISPLAY" | doas -u "$target" xauth merge - && \
	  doas -u newgrp -c "firejail --x11=xephyr --private=/isolated/${target}/firefox_sandbox --ignore=nogroups --profile=/etc/firejail/firefox.profile /apps/firefox/firefox" \
	  audio video 
	  
	`newgrp` гарантирует, что процесс запуститься с нужными группами, которые определяют права, поэтому мы игнорируем `nogroups` (потому что пользователь, с правами которого мы запускаем программу, уже и так прав не имеет, сколько мы). `--x11=xephyr` запускает nested X server для дополнительной изоляции. 
	Можно также было заметить странный путь к `firefox`. Это связанно с тем, что используется portable-версия Firefox. В домашнем каталоге Firefox (`/apps/firefox`) все файлы принадлежат пользователю `admin` с правами rw (и rwx на исполняемые и каталоги) и группе `u1000_firefox` с правами rx. Так сделано, чтобы пользователь не мог исполнять другие программы (в sandbox'е он видит только свои файлы), а также чтобы программа самостоятельно не могла обновится/добавить другие программы в свой каталог для исполнения.